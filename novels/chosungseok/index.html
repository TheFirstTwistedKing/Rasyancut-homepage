<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>라시안컷 소설</title>
<style>html,body{margin:0;background:#02030a}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+KR:wght@300;400;500&family=Share+Tech+Mono&display=swap">
<style>
/* 레이아웃: 고정된 우주 캔버스 위에 가운데 정렬된 한 줄짜리 본문 기둥. 위에서부터 오프너(챕터 표시) → 본문 → 끝맺음. 우주 한 가지 분위기로만 만든 페이지라 라이트/다크를 나누지 않는다. */
:root{
  --bg:#02030a; --ink:#E6E3F2; --ink-2:#B3B0CA; --say:#FFFFFF;
  --gold:#E9D8A6; --amber:#FFB45A; --lilac:#9C8CFF; --cyan:#6FD0FF;
  --line:rgba(233,216,166,.3); --glass:rgba(5,7,18,.78);
  --f-body:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  --f-disp:'Cinzel','Noto Serif KR','Batang',serif;
  --f-mono:'Share Tech Mono','D2Coding','Consolas',ui-monospace,monospace;
  --gut:clamp(18px,5vw,40px);
  --fs:clamp(17px,.5vw + 15.4px,20px); --fz:1;
  --ease:cubic-bezier(.2,.7,.2,1);
  --veil:0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(var(--fs)*var(--fz));line-height:1.9;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.mono{font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- 배경 ---------- */
#space{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;background:var(--bg)}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--veil);
  background:radial-gradient(ellipse 62% 100% at 50% 50%,rgba(2,3,10,.5),rgba(2,3,10,.34) 60%,rgba(2,3,10,.12) 100%)}
.edge{position:fixed;left:0;right:0;z-index:3;pointer-events:none;opacity:var(--veil)}
.edge.t{top:0;height:calc(92px + env(safe-area-inset-top,0px));background:linear-gradient(rgba(2,3,10,.92),rgba(2,3,10,0))}
.edge.b{bottom:0;height:calc(120px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(2,3,10,0),rgba(2,3,10,.9))}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:max(14px,env(safe-area-inset-top,0px)) var(--gut) 0;pointer-events:none}
#hud>*{pointer-events:auto}
.hb{display:inline-flex;align-items:center;gap:10px;min-height:42px;padding:0 16px 0 12px;border:1px solid var(--line);background:rgba(4,6,16,.55);color:var(--gold);font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .25s,box-shadow .25s,color .25s}
.hb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hb:hover{border-color:var(--amber);color:#fff2cf;box-shadow:0 0 22px rgba(255,180,90,.28)}
.hb.tool{padding:0 14px}
.hud-in{opacity:0;translate:0 24px}
body.live .hud-in{animation:rise .9s var(--ease) both}
body.live .hud-in.d2{animation-delay:.12s}

#panel{position:fixed;z-index:21;right:var(--gut);top:calc(max(14px,env(safe-area-inset-top,0px)) + 52px);width:min(310px,calc(100% - var(--gut)*2));padding:18px 18px 20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;flex-direction:column;gap:18px;box-shadow:0 18px 60px rgba(0,0,0,.55)}
#panel.show{display:flex;animation:rise .45s var(--ease) both}
#panel.hide{display:flex;animation:fall .35s ease-in both;pointer-events:none}
#panel h2{margin:0;font-weight:400;font-size:11px;color:var(--gold);opacity:.8}
.row{display:flex;flex-direction:column;gap:9px}
.row>label,.row>span.lb{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;min-height:38px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--ink-2);transition:background .2s,color .2s}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(255,180,90,.16);color:#fff2cf;box-shadow:inset 0 -2px 0 var(--amber)}
.seg button:hover{color:#fff}
.stp{display:flex;align-items:center;border:1px solid var(--line)}
.stp button{width:44px;min-height:38px;font-family:var(--f-mono);font-size:16px;color:var(--gold)}
.stp output{flex:1;text-align:center;font-family:var(--f-mono);font-size:13px;letter-spacing:.1em}

#prog{position:fixed;z-index:15;right:max(10px,env(safe-area-inset-right,0px));top:22%;height:56%;width:14px;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0}
body.live #prog{animation:fadein 1.2s .6s both}
#prog .ln{position:relative;flex:1;width:1px;background:linear-gradient(transparent,rgba(233,216,166,.28) 12%,rgba(233,216,166,.28) 88%,transparent)}
#prog .ln i{position:absolute;left:50%;top:0;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#ffe9b8;box-shadow:0 0 10px 2px rgba(255,180,90,.8)}
#prog b{margin-top:8px;font-family:var(--f-mono);font-weight:400;font-size:9px;letter-spacing:.08em;color:rgba(233,216,166,.6)}

/* ---------- 본문 ---------- */
main{position:relative;z-index:2}
.opener{min-height:94svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:54svh var(--gut) 5svh;text-align:center}
.chk{font-family:var(--f-disp);font-size:clamp(13px,1.5vw,17px);letter-spacing:.62em;padding-left:.62em;color:var(--gold)}
.chn{font-family:var(--f-disp);font-weight:400;font-size:clamp(60px,9vw,108px);line-height:1;color:#fff3d4;text-shadow:0 0 26px rgba(255,180,90,.55),0 0 90px rgba(255,140,60,.28)}
.cue{margin-top:clamp(18px,4svh,40px);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:10px;color:rgba(233,216,166,.62);opacity:0;transition:opacity .8s}
.cue.on{opacity:1}
.cue i{display:block;width:1px;height:38px;background:linear-gradient(rgba(233,216,166,0),#ffe9b8);transform-origin:top;animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0)}55%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}

.chapter{width:min(34em,calc(100% - var(--gut)*2));margin:0 auto;padding-top:2svh}
.chapter+.chapter{margin-top:34svh}
.chhead{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 0 4.5em;text-align:center}
.chhead .chn{font-size:clamp(56px,9vw,100px)}
.p{margin:0 0 1.3em;line-height:2.02;word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty;color:var(--ink);text-shadow:0 0 14px rgba(2,3,10,.95),0 1px 2px rgba(2,3,10,.9)}
.p.d{position:relative;margin-bottom:1.15em;padding-left:1.15em;color:var(--say)}
.p.d::before{content:"";position:absolute;left:0;top:.5em;bottom:.5em;width:2px;border-radius:2px;background:linear-gradient(var(--lilac),rgba(156,140,255,.1));transform:scaleY(0);transform-origin:top;transition:transform .9s var(--ease)}
.p.d.on::before{transform:scaleY(1)}
.w{white-space:nowrap}
.c{display:inline-block;opacity:0}
.on .c{animation:cin 1.05s var(--ease) both;animation-delay:calc(var(--i)*var(--st,16ms))}
@keyframes cin{
  0%{opacity:0;transform:translateY(.8em) scale(1.35);filter:blur(5px);color:#ffd08a;text-shadow:0 0 22px rgba(255,170,80,1),0 0 4px rgba(255,214,150,.9)}
  45%{opacity:1;transform:translateY(0) scale(1.06);filter:blur(0);color:#fff1cf;text-shadow:0 0 16px rgba(255,190,110,.85)}
  100%{opacity:1;transform:none;filter:none}
}
.c.g{color:#fff0c2;text-shadow:0 0 14px rgba(255,196,96,.6),0 0 2px rgba(255,236,190,.8)}
.fx-off .c{opacity:1!important;animation:none!important;transform:none!important;filter:none!important}

.orn{display:grid;place-items:center;margin:3.4em 0 3em;color:var(--gold);opacity:0;transform:translateY(26px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.orn.on{opacity:1;transform:none}
.orn svg{width:34px;height:34px;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(255,180,90,.65))}
.orn svg .e{transform-origin:12px 12px;animation:spin 14s linear infinite}
.fx-off .orn,.fx-off .hud-in{opacity:1;transform:none;translate:0}
@keyframes spin{to{transform:rotate(360deg)}}

.end{width:min(34em,calc(100% - var(--gut)*2));margin:0 auto;padding:2em 0 calc(18svh + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;opacity:0;transform:translateY(26px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.end.on{opacity:1;transform:none}
.end .orn{opacity:1;transform:none;margin:1em 0 .4em}
.end .orn svg{width:48px;height:48px}
.endk{font-size:12px;color:var(--gold)}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid var(--line);background:rgba(4,6,16,.55);color:var(--gold);font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;transition:border-color .25s,box-shadow .25s,color .25s}
.btn:hover{border-color:var(--amber);color:#fff2cf;box-shadow:0 0 22px rgba(255,180,90,.28)}
.nxt{font-size:11px;color:rgba(233,216,166,.5)}

/* ---------- 전환 막(연결 중) ---------- */
#gate{position:fixed;inset:0;z-index:200;display:none;place-items:center;background:var(--bg)}
#gate.show{display:grid}
#gate .box{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(300px,76vw)}
#gate.in{animation:rise .6s var(--ease) both}
#gate.out{animation:fall .85s ease-in both;pointer-events:none}
#gate .ring{position:relative;width:clamp(116px,14vw,160px);aspect-ratio:1;display:grid;place-items:center}
#gate .ring svg.r{position:absolute;inset:0;width:100%;height:100%;overflow:visible;fill:none;stroke:#e9d8a6}
#gate .ring .a1{transform-origin:0 0;animation:spin 3.6s linear infinite}
#gate .ring .a2{transform-origin:0 0;animation:spin 6s linear infinite reverse}
#gate .ico{width:46%;height:46%;color:#ffd993;filter:drop-shadow(0 0 10px rgba(255,180,90,.8))}
#gate .ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
#gate .lab{font-size:12px;color:var(--gold)}
#gate .bar{width:100%;height:3px;background:rgba(233,216,166,.18);position:relative;overflow:hidden}
#gate .bar i{position:absolute;inset:0;background:var(--amber);transform-origin:left;transform:scaleX(0);box-shadow:0 0 12px var(--amber)}
#gate.show .bar i{animation:fillbar 1s cubic-bezier(.4,.1,.3,1) forwards}
@keyframes fillbar{to{transform:scaleX(1)}}

@keyframes rise{from{opacity:0;translate:0 34px}to{opacity:1;translate:0 0}}
@keyframes fall{from{opacity:1;translate:0 0}to{opacity:0;translate:0 34px}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

@media (max-width:560px){
  #prog{display:none}
  .hb{padding:0 12px 0 10px;font-size:11px}
  .hb.tool{padding:0 11px}
  .p{line-height:1.96}
  #veil{background:rgba(2,3,10,.42)}
}
noscript .ns{position:relative;z-index:5;max-width:34em;margin:20vh auto;padding:0 var(--gut);color:var(--ink)}

/* ---------- 계속 움직이는 글자 효과 ---------- */
.p{transition:opacity .5s ease-out}
.opener .chn{animation:numglow 5.2s ease-in-out infinite,numfloat 7s ease-in-out infinite}
@keyframes numglow{0%,100%{text-shadow:0 0 22px rgba(255,180,90,.45),0 0 70px rgba(255,140,60,.2)}50%{text-shadow:0 0 34px rgba(255,190,110,.85),0 0 120px rgba(255,150,70,.42)}}
@keyframes numfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.opener .chk{animation:kbreath 6s ease-in-out infinite}
@keyframes kbreath{0%,100%{letter-spacing:.62em}50%{letter-spacing:.7em}}
.c.g{animation:gemshine 5.5s ease-in-out infinite;animation-delay:calc(var(--i)*70ms + 1.6s)}
@keyframes gemshine{0%,70%,100%{color:#fff0c2;text-shadow:0 0 14px rgba(255,196,96,.6),0 0 2px rgba(255,236,190,.8)}82%{color:#ffffff;text-shadow:0 0 26px rgba(255,214,130,1),0 0 6px rgba(255,255,255,.95)}}
.on .c.g{animation:cin 1.05s var(--ease) both,gemshine 5.5s ease-in-out infinite;animation-delay:calc(var(--i)*var(--st,16ms)),calc(var(--i)*var(--st,16ms) + 1.6s)}
.p.d::after{content:"";position:absolute;left:0;top:.5em;width:2px;height:1.1em;border-radius:2px;background:linear-gradient(transparent,#fff,transparent);opacity:0}
.p.d.on::after{animation:barrun 4.6s ease-in-out infinite;animation-delay:1.4s}
@keyframes barrun{0%{opacity:0;transform:translateY(0)}12%{opacity:.95}60%{opacity:.95}78%,100%{opacity:0;transform:translateY(calc(100% + 1.2em))}}
.orn svg{animation:ornglow 4.4s ease-in-out infinite}
@keyframes ornglow{0%,100%{filter:drop-shadow(0 0 5px rgba(255,180,90,.45))}50%{filter:drop-shadow(0 0 15px rgba(255,190,110,.95))}}
.fx-off .opener .chn,.fx-off .opener .chk,.fx-off .c.g,.fx-off .p.d::after,.fx-off .orn svg{animation:none}

</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>
<div class="edge t" aria-hidden="true"></div>
<div class="edge b" aria-hidden="true"></div>

<header id="hud">
  <a class="hb hud-in" id="btnBack" href="../../index.html" aria-label="소설 모음집으로 돌아가기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4"/><path d="M10 5.5L3.5 12 10 18.5"/></svg><span>모음집</span>
  </a>
  <button class="hb tool hud-in d2" id="btnTool" type="button" aria-expanded="false" aria-controls="panel" aria-label="읽기 설정">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18L9 6l5 12"/><path d="M5.8 14h6.4"/><path d="M15.5 18l2.7-6.5 2.7 6.5"/><path d="M16.3 16.2h3.8"/></svg>
  </button>
</header>

<aside id="panel" aria-label="읽기 설정">
  <h2 class="mono">Reading // 읽기 설정</h2>
  <div class="row"><span class="lb">글자 크기</span>
    <div class="stp"><button id="szDown" type="button" aria-label="글자 작게">−</button><output id="szVal" aria-live="polite">100%</output><button id="szUp" type="button" aria-label="글자 크게">+</button></div></div>
  <div class="row"><span class="lb">글자 나타나는 속도</span>
    <div class="seg" id="segFx"><button type="button" data-v="off" aria-pressed="false">끔</button><button type="button" data-v="fast" aria-pressed="false">빠름</button><button type="button" data-v="normal" aria-pressed="true">보통</button><button type="button" data-v="slow" aria-pressed="false">느림</button></div></div>
  <div class="row"><span class="lb">우주 배경 움직임</span>
    <div class="seg" id="segBg"><button type="button" data-v="on" aria-pressed="true">켬</button><button type="button" data-v="off" aria-pressed="false">끔</button></div></div>
</aside>

<div id="prog" aria-hidden="true"><div class="ln"><i id="progDot"></i></div><b id="progPct">0%</b></div>

<main id="story"></main>
<noscript><div class="ns">이 소설은 자바스크립트가 켜져 있어야 읽을 수 있습니다.</div><style>#gate{display:none!important}</style></noscript>

<div id="gate" class="show" aria-hidden="true">
  <div class="box">
    <div class="ring">
      <svg class="r" viewBox="-100 -100 200 200"><circle r="78" opacity=".3"/><circle class="a1" r="90" stroke="#ffb45a" stroke-width="2" stroke-dasharray="46 34"/><circle class="a2" r="66" stroke="#c9a94c" stroke-width="1.4" stroke-dasharray="6 10"/></svg>
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4"/><ellipse cx="12" cy="12" rx="9.8" ry="2.5" transform="rotate(-12 12 12)"/><path d="M6.6 9.2a6.2 6.2 0 0 1 10.8 0"/><path d="M7.6 15.4a6 6 0 0 0 8.8 0"/></svg></div>
    </div>
    <div class="lab mono">Linking</div>
    <div class="bar"><i></i></div>
  </div>
</div>
<script>
const STORY = [{"n":1,"items":[{"t":"밥 안 먹어?","d":1,"mood":"calm"},{"t":"배가 고프지 않은 아침이었다. 문 너머의 목소리가 누구의 것인지는 보지 않아도 알았다. 이성하. 매일 아침 내 방 문을 두드리는 사람은 그녀뿐이었다. 그녀는 교도관이고, 나는 죄수다. 몇 개월 전까지만 해도 내 인생이 이렇게 될 줄은 상상도 못 했는데. 그래도 아직은 행복했다. 사랑하는 사람이 곁에 있으니까. 이 감옥으로 온 걸 천만다행으로 여겨야 하는지도 모른다."},{"t":"나는 돌아누운 채 투덜거리듯 대답했다."},{"t":"…안 먹어.","d":1},{"t":"성하는 그래도 먹는 게 낫지 않겠냐며 나를 달랬다. 나는 가끔 짧게 대꾸할 뿐 대화를 이어 가지 않았다. 그럴 이유가 없었고, 무엇보다 오늘은 기분이 가라앉은 날이었다. 그녀는 몇 분쯤 문 앞에 서 있다가 말없이 돌아갔다. 발소리가 멀어지고 나서야 나는 숨을 내쉬었다."},{"t":"운동장으로 나가 벤치에 앉았다. 품에는 광물 도감 몇 권이 있었다. 석영, 형석, 황철석. 책장을 넘기며 이름을 하나씩 입속으로 굴렸다. 광석을 모으는 일은 이 안에서 내게 남은 유일한 취미였고, 나는 그 시간을 방해받고 싶지 않았다.","brk":1},{"t":"그러나 오래가지 못했다. 책 위로 그림자가 드리웠다. 고개를 들자 우락부락한 덩치의 남자가 나를 내려다보고 있었다. 그는 아무 말 없이 내 손에서 책을 낚아채더니, 내가 손을 뻗기도 전에 세 번에 걸쳐 찢어 바닥에 던졌다."},{"t":"애새끼가 이런 거나 읽고 앉았네.","d":1},{"t":"찢어진 페이지가 바람에 굴러갔다. 귀 끝이 뜨거워졌다. 화가 치밀어 올라 나는 주먹을 쥐고 일어섰다. 싸움이 벌어지기 직전, 운동장 저편에서 걸어오는 성하가 보였다."},{"t":"그녀는 한마디도 없이 남자를 순식간에 때려눕혔다. 그러고는 곧장 내게 몸을 돌려, 짝, 내 뺨을 때렸다."},{"t":"뺨이 얼얼했다. 이유는 알았다. 이 책들 때문이다."},{"t":"내가 다른 책 좀 보라고 했잖아… 유치하지도 않아?","d":1},{"t":"맞은 뺨보다 그 말이 더 아팠다. 유치하다는 건 나도 알고 있었다. 이런 일로 싸운 것도 한두 번이 아니었다. 성하의 손은 아직 허공에 떠 있었다. 때린 쪽이 더 놀란 얼굴이었다. 나는 먼저 사과하고 방으로 돌아갔다."},{"t":"낡은 침대에 누워 눈을 감았다. 분명, 분명히 이렇지 않았는데."},{"t":"얼마나 지났을까, 문이 살그머니 열렸다."},{"t":"괜찮아?","d":1},{"t":"성하였다. 놀리러 온 건지 사과하러 온 건지는 알 수 없었지만, 신경 쓰지 않기로 했다."},{"t":"아까는 미안했어. 나도 모르게 짜증이 나서… 원하면 네가 읽고 싶은 책, 같이 읽어줄게.","d":1},{"t":"화는 이미 풀린 지 오래였다. 그런데도 책을 읽고 싶지는 않았다. 혼자 있고 싶은 걸까 생각했지만, 아니었다. 어쩌면 나는 그녀와 함께 있고 싶었던 건지도 모른다. 게다가 언제까지고 이렇게 뚱해 있을 수는 없는 노릇이었다. 나는 침대에서 천천히 일어나 그녀에게 성큼성큼 다가갔다."},{"t":"괜찮아. 사람이 그럴 수도 있는 거지 뭐. 내가 잘못했어.","d":1},{"t":"안도한 그녀를 나는 가만히 끌어안았다. 이 평화가 계속되면 얼마나 좋을까. 그 평화가 점심때까지밖에 가지 않으리라는 건, 그때의 나는 알지 못했다."},{"t":"점심 무렵이었다. 낮잠에 빠져 있던 나는 어딘가에서 터진 비명에 눈을 떴다. 한 번으로 끝나지 않았다. 비명은 복도를 따라 번졌고, 곧 쇠 부딪치는 소리와 무언가 쓰러지는 소리가 뒤따랐다. 졸린 눈을 비비며 방을 나선 나는 그대로 굳어 버렸다.","brk":1,"mood":"dread"},{"t":"얼굴이 없는 자들이 복도에 서 있었다. 말 그대로였다. 눈도 코도 입도 없는 매끈한 머리가 간수와 죄수를 가리지 않고 죽이고 있었다. 입이 없는 것들은 소리조차 내지 않았다. 비명은 전부 쓰러지는 사람들의 것이었다."},{"t":"머릿속이 하얘졌다. 무슨 상황인지 전혀 이해되지 않았다. 이해할 시간도 없었다. 나는 방으로 돌아가 침대 밑을 더듬었다. 손끝에 차가운 나이프가 닿았다. 숨겨 둔 물건이 이런 식으로 쓰일 줄은 몰랐다."},{"t":"나이프를 쥐고 복도로 나갔다. 첫 번째를 어떻게 쓰러뜨렸는지는 기억나지 않는다. 두 번째, 세 번째. 손이 떨렸지만 멈출 수 없었다. 한 명, 또 한 명, 천천히 베어 나갔다. 그래도 복도 끝에서는 새로운 것들이 끝없이 나타났고, 나는 한 걸음씩 밀렸다. 등이 벽에 닿았다. 눈앞에서 얼굴 없는 머리가 내 쪽으로 기울었다."},{"t":"그때 누군가 내 팔을 낚아챘다."},{"t":"일어나!","d":1},{"t":"성하였다. 그녀는 나를 끌고 복도를 내달렸다. 계단을 오르고 문을 몇 개 지나 어느 모퉁이에서 겨우 멈췄다. 나는 숨이 목까지 차올라 그대로 다리가 풀렸고, 바닥에 주저앉았다."},{"t":"여기서 탈출해야 해. 옥상에 헬리콥터가 있어. 거기로 가자.","d":1},{"t":"헬리콥터. 구조. 그리고 그다음. 머릿속에 그려진 건 그 순서였다. 이 소동이 끝나면 나는 다시 그 방으로 돌아가고, 아침마다 그 문 앞에서 같은 질문을 듣게 되겠지. 나는 생각이 달랐다."},{"t":"…더 이상 이렇게 살기는 싫어. 난… 너와 함께 도망치고 싶어.","d":1},{"t":"성하의 눈이 커졌다. 한동안 아무 말도 없이 나를 내려다보았다. 복도 저편에서 쾅, 하고 문 부서지는 소리가 났다. 그러자 그녀가 숨을 삼키듯 웃었다."},{"t":"…그럴까?","d":1},{"t":"망설임은 단 한 순간도 없었다. 그녀도 이곳이 지긋지긋했던 걸까. 하기야 나 역시 예전에 하던 일이 교도관보다는 나았을지언정, 금방 질리곤 했으니까. 성하의 숨은 처음엔 떨렸지만 금세 적응한 사람처럼 가라앉았다."},{"t":"우리는 소란을 틈타 몰래 빠져나와 주차장에 세워 둔 성하의 차에 올랐다."},{"t":"목적지는 정해져 있었다. 스텔마레. 가장 살기 좋은 다섯 나라 중에서도 손에 꼽히는, 더없이 평온한 나라였다. 항구까지는 아직 먼데 연료 계기판은 바닥을 가리키고 있었다. 성하가 전에 장거리 여행을 다녀오고서 기름을 채워 두지 않았던 탓이다. 우리는 길가의 주유소에 차를 세웠다."},{"t":"주유가 시작되는 걸 보고 나는 자판기 앞으로 갔다. 별빛 탄산. 새콤달콤하면서 톡 쏘는 맛이 일품이라 내가 좋아하는 음료다. 캔을 따서 한 모금씩 마시는 동안만큼은 방금 전의 일들이 조금 먼 곳의 이야기처럼 느껴졌다."},{"t":"다 마신 캔을 버리고 돌아서려는 순간, 앞에 그것이 서 있었다."},{"t":"교도소에서 본 얼굴 없는 자였다. 어떻게 여기까지 따라온 건지는 알 수 없었다. 손에는 아무 무기도 없었다. 그런데도 강했다. 발차기 한 번에 나는 허리가 꺾여 바닥을 굴렀다. 숨이 쉬어지지 않았다. 나를 이렇게 한 방에 무력화시킨 존재는 처음이었다."},{"t":"그것이 한 걸음 더 다가왔을 때, 그 뒤에서 칼날이 솟았다. 검 한 자루가 얼굴 없는 자의 몸을 관통했고, 그것은 힘이 빠진 듯 무너졌다. 뒤에 서 있던 건 주유소 사장이었다."},{"t":"그는 이게 도대체 무슨 일이냐는 표정이었다. 나는 숨을 고르며 아는 대로 설명했다. 교도소가 습격당한 일, 얼굴 없는 자들, 우리가 도망쳐 나온 이유까지. 사장은 말없이 듣다가 가게로 들어가더니 카타나를 닮은 검 한 자루를 들고 나왔다."},{"t":"가져가. 그 칼로는 모자랄 거다.","d":1},{"t":"친절한 사람이었다. 나는 고개를 숙여 감사를 전하고 검을 받아 들었다."},{"t":"가게에서 나와 보니 차 옆에 성하가 없었다. 두리번거리는데, 뒤쪽에서 재빠르게 뛰어오는 발소리가 들렸다."},{"t":"어디 갔다 온 거야?","d":1},{"t":"에헤헤… 미안, 화장실 좀 갔다 오느라…","d":1},{"t":"우리가 차에 오르려는데 사장이 다가와 한 가지를 일러 주었다."},{"t":"갈림길이 나오면 절대 왼쪽으로는 가지 마.","d":1},{"t":"하지만 항구로 가려면 왼쪽이 맞았고, 그 길밖에 없었다. 성하와 눈이 마주쳤다. 둘 다 아무 말도 하지 않았다. 우리는 그의 충고를 무시하기로 했다."},{"t":"핸들은 왼쪽으로 꺾였다."},{"t":"항구에 도착하자 부두 끝에 사람 하나가 서 있었다. 얼굴에는 가면을 쓰고 있어서 표정을 읽을 수 없었다. 그가 우리를 향해 손을 흔들었다.","brk":1,"mood":"sea"},{"t":"안녕, 너희들 혹시 여기는 처음이니?","d":1},{"t":"…몇 번 와 본 적은 있어요.","d":1},{"t":"저는 처음입니다.","d":1},{"t":"그는 이유도 말하지 않은 채 우리에게 배 한 척을 내주었다. 원양어선처럼 생긴 낡은 배였다. 믿어도 되는 사람인지는 알 수 없었다. 다만 우리를 해칠 사람이라면 굳이 배를 내줄 이유가 없었다. 게다가 다른 방법도 없었기에 일단 그 배를 타기로 했다. 가면의 남자는 내게 조작법을 가르쳐 주고는 동행하겠다고 제안했고, 우리 둘 다 승낙했다."},{"t":"그는 승낙해 줬으니 자기소개를 하겠다며 가면을 벗었다."},{"t":"드러난 얼굴은 낯설지 않았다. 어디선가 분명히 본 이목구비였다. 하지만 어디였는지는 떠오르지 않았다."},{"t":"노아라고 합니다.","d":1},{"t":"그는 그 말만 남기고 가면을 다시 썼다."},{"t":"그러고 보니, 얼굴 없는 자들이 나타난 뒤로 무언가 이상했다. 나는 무심코 아침에 읽던 도감의 목차를 떠올리려 했다. 석영, 형석, 그리고 그다음. 입속으로 굴리던 이름 하나가 거기 없었다. 몇 번을 더듬어도 그 자리는 텅 비어 있었다. 머릿속이 조금씩 비워지는 느낌이었다. 나만 그런 건지 알 수 없어서 성하에게 물었다.","mood":"gate"},{"t":"성하야, 혹시 느끼고 있니? 기억이 사라지고 있는 것 같은데…","d":1},{"t":"응. 나도 느끼고 있어. 조금 심각한 것 같아.","d":1},{"t":"그러자 노아가 가면 몇 개를 더 꺼내 우리에게 내밀었다."},{"t":"이걸 써 보시죠. 기억이 돌아올 겁니다.","d":1},{"t":"반신반의하며 가면을 썼다. 그 순간, 막혀 있던 곳이 뚫리듯 모든 게 한꺼번에 돌아왔다. 빈자리에는 '황철석'이라는 이름이 도로 들어찼다. 입이 다물어지지 않았다. 마법 같았다."},{"t":"노아는 이 현상을 알고 있는 눈치였다. 나는 그에게 얼굴 없는 자들이 무엇인지 물었다."},{"t":"이중 차원이라고 부르는 현상입니다. 꽤 희귀해서 들어 보신 적은 없을 거예요.","d":1},{"t":"잠깐 말을 끊었다가 그가 이었다."},{"t":"이 현상이 일어나는 동안에는 기억이 조금씩 소멸됩니다. 중앙에 있는 왜곡된 관문이 우리의 기억을 빨아들이거든요. 하지만 이 가면만 있으면 금방 회복할 수 있어요.","d":1},{"t":"나와 성하는 '이중 차원'이라는 말을 어디선가 어렴풋이 들은 적이 있었다. 하지만 그게 정확히 무엇인지는 몰랐다. 이제는 안다. 지금 내가, 그 한가운데에 있으니까."}]}];

/* ==========================================================================
   설정 (이 기기에만 저장). 모음집에서 '애니메이션 끔'을 골랐다면 그 값도 따른다.
   ========================================================================== */
const KEY = 'rsc.novel.';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },
};
let siteMotion = 'slow';
try { const v = localStorage.getItem('rsc.motion'); if (v) siteMotion = JSON.parse(v); } catch (e) {}
const HARD_OFF = siteMotion === 'off'; // 모음집과 같은 규칙: 기기의 '모션 줄이기' 설정과 상관없이 사용자가 고른 값만 따른다
const STEP = { fast: [9, 1100], normal: [20, 2300], slow: [36, 3600] };
const cfg = {
  size: clamp(+store.get('size', 100) || 100, 85, 140),
  fx: HARD_OFF ? 'off' : (['off', 'fast', 'normal', 'slow'].includes(store.get('fx', 'normal')) ? store.get('fx', 'normal') : 'normal'),
  bg: HARD_OFF ? 'off' : (store.get('bg', 'on') === 'off' ? 'off' : 'on'),
};
function applyCfg() {
  document.documentElement.style.setProperty('--fz', (cfg.size / 100).toFixed(2));
  document.body.classList.toggle('fx-off', cfg.fx === 'off');
}

      cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = Math.min(1, ign * dim * (.88 + .12 * pulse)); cx.drawImage(bhBack, bx - sw / 2, by - sh / 2, sw, sh);

/* ==========================================================================
   전환 막: 들어올 때 열리고, 나갈 때 닫힌다 (올라오며 나타나고 내려가며 사라짐)
   ========================================================================== */
const Gate = {
  el: $('#gate'),
  async open() { // 시작할 때 막을 걷는다
    const g = this.el; g.className = 'show';
    await new Promise(r => setTimeout(r, HARD_OFF ? 40 : 1250));
    g.className = 'show out'; await new Promise(r => setTimeout(r, HARD_OFF ? 20 : 820)); g.className = '';
  },
  async leave(href) {
    const g = this.el; g.className = 'show in'; $('.lab', g).textContent = 'Returning';
    let gone = false; addEventListener('pagehide', () => { gone = true; }, { once: true });
    await new Promise(r => setTimeout(r, HARD_OFF ? 20 : 1100));
    location.href = href;
    setTimeout(() => { if (!gone) { g.className = 'show out'; setTimeout(() => { g.className = ''; }, 900); } }, 4500);
  },
};

/* ==========================================================================
   화면 요소들
   ========================================================================== */
function bindHud() {
  const panel = $('#panel'), tb = $('#btnTool');
  const closeP = () => { if (!panel.classList.contains('show')) return; panel.classList.remove('show'); panel.classList.add('hide'); tb.setAttribute('aria-expanded', 'false'); setTimeout(() => panel.classList.remove('hide'), HARD_OFF ? 10 : 360); };

  panel.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', closeP);
  const sync = () => {
    $('#szVal').textContent = cfg.size + '%';
    $$('#segFx button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === cfg.fx)));
    $$('#segBg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === cfg.bg)));
    $('#szDown').disabled = cfg.size <= 85; $('#szUp').disabled = cfg.size >= 140;
  };
  $('#szDown').addEventListener('click', () => { cfg.size = Math.max(85, cfg.size - 5); store.set('size', cfg.size); applyCfg(); sync(); sweep(); focusText(); });
  $('#szUp').addEventListener('click', () => { cfg.size = Math.min(140, cfg.size + 5); store.set('size', cfg.size); applyCfg(); sync(); sweep(); focusText(); });
  $('#segFx').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cfg.fx = b.dataset.v; store.set('fx', cfg.fx); applyCfg(); sync(); focusText(); });

  addEventListener('keydown', e => { if (e.key === 'Escape') { if (panel.classList.contains('show')) closeP(); else back($('#btnBack').getAttribute('href'))(); } });

let tick = 0;
function onScroll() {

function start() {
