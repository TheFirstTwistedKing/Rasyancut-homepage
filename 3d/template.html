<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>라시안컷 3D</title>
<style>
:root{--gold:#c9a94c;--pale:#e9d8a6;--lemon:#fff3a6;--yellow:#ffd93d;--ink:#050403;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:16px/1.6 'Nanum Myeongjo','Noto Serif KR','Batang',serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mono{font-family:'Share Tech Mono','D2Coding','Consolas',ui-monospace,monospace;letter-spacing:.14em}
#hud{position:fixed;left:14px;top:max(12px,env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--lemon);text-shadow:0 1px 3px #000;pointer-events:none}
#hud small{font-size:10px;color:rgba(233,216,166,.7)}
#prompt{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 150px);translate:-50% 0;z-index:5;padding:7px 16px;border:1px solid var(--gold);background:rgba(8,8,8,.82);color:var(--lemon);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#prompt.on{opacity:1}
#msg{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));translate:-50% 0;width:min(920px,calc(100% - 28px));min-height:128px;padding:18px 24px 20px;z-index:8;background:linear-gradient(180deg,rgba(12,16,40,.94),rgba(6,8,22,.96));border:2px solid var(--pale);border-radius:8px;box-shadow:0 0 0 2px #000,0 18px 60px rgba(0,0,0,.7)}
#msg[hidden],#choice[hidden],#elev[hidden],#quest[hidden],#pad[hidden]{display:none}
#msg b{display:block;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--yellow);margin-bottom:6px;font-weight:400}
#msg p{margin:0;font-size:clamp(16px,1.9vw,22px);line-height:1.85;white-space:pre-line;word-break:keep-all;min-height:3.7em}
#msg i{position:absolute;right:18px;bottom:10px;font-style:normal;color:var(--yellow);opacity:0}
#msg i.on{opacity:1;animation:nd 1s ease-in-out infinite}
@keyframes nd{50%{translate:0 4px}}
#choice{position:fixed;right:max(16px,calc(50% - 450px));bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 142px);z-index:9;display:flex;flex-direction:column;min-width:150px;background:rgba(8,10,28,.96);border:2px solid var(--pale);border-radius:6px}
#choice button{padding:10px 24px 10px 34px;text-align:left;font:inherit;font-size:19px;color:#fff;background:none;border:0;position:relative;cursor:pointer}
#choice button.on{background:rgba(255,217,61,.2);color:var(--lemon)}
#choice button.on::before{content:"▶";position:absolute;left:12px;color:var(--yellow);font-size:13px;top:50%;translate:0 -50%}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s ease;z-index:20;display:grid;place-items:center}
#fade.on{opacity:1;pointer-events:auto}
#floor{display:flex;align-items:baseline;gap:6px;color:#ffb84a;text-shadow:0 0 18px rgba(255,184,74,.7);font-family:'Share Tech Mono',monospace}
#floor[hidden]{display:none}
#floor small{font-size:12px;letter-spacing:.3em;color:rgba(255,184,74,.7);margin-right:10px}
#floor b{font-size:clamp(64px,14vw,120px);font-weight:700}
#floor i{font-style:normal;font-size:30px}#floor em{font-style:normal;font-size:26px;margin-left:14px}
#elev{position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:9;width:min(340px,calc(100% - 32px));background:linear-gradient(180deg,#14181d,#0a0d11);border:2px solid #46525f;box-shadow:0 0 0 1px #000,0 24px 70px rgba(0,0,0,.8);padding:14px}
#elev .top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin-bottom:10px;background:#05080b;border:1px solid #2c3640;font-size:11px;color:rgba(255,184,74,.8)}
#elev .top b{font-size:26px;color:#ffb84a;font-weight:700}
#elev button{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;margin-top:8px;text-align:left;color:#cfd6de;background:#171c22;border:1px solid #2c3640;font:inherit;cursor:pointer}
#elev button i{font:700 22px 'Share Tech Mono',monospace;font-style:normal;color:#ffb84a;min-width:64px}
#elev button span{flex:1;font-size:17px}
#elev button em{font:10px 'Share Tech Mono',monospace;font-style:normal;letter-spacing:.2em;color:rgba(207,214,222,.5)}
#elev button.cur{border-color:#ffb84a}#elev button.cur em::after{content:" · 현재 층";color:#ffb84a}
#elev button.on{background:rgba(255,184,74,.14);border-color:#ffb84a;color:#fff}
#quest{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));z-index:6;width:min(270px,calc(100% - 32px));padding:12px 16px;background:rgba(6,10,28,.92);border:1px solid var(--gold);box-shadow:0 0 22px rgba(255,217,61,.14);pointer-events:none;animation:qin .7s ease both}
#quest b{font-size:11px;letter-spacing:.3em;color:var(--yellow);font-weight:400}
#quest h4{margin:4px 0;font-size:17px}#quest p{margin:0 0 6px;font-size:13px;line-height:1.5;color:var(--pale)}#quest em{font-style:normal;font-size:10px;letter-spacing:.14em;color:rgba(255,217,61,.7)}
@keyframes qin{from{opacity:0;translate:60px 0}to{opacity:1;translate:0 0}}
#help{position:fixed;left:14px;bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:4;font-size:11px;color:rgba(233,216,166,.65);pointer-events:none;text-shadow:0 1px 3px #000}
#pad{position:fixed;inset:0;z-index:7;pointer-events:none}
#stick{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 8px);width:132px;height:132px;border-radius:50%;border:2px solid rgba(233,216,166,.5);background:rgba(10,10,10,.35);pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,217,61,.35);border:2px solid var(--yellow)}
#act{position:absolute;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 26px);width:92px;height:92px;border-radius:50%;border:2px solid var(--yellow);background:rgba(255,217,61,.18);color:var(--lemon);font:inherit;font-size:20px;pointer-events:auto;touch-action:none}
#start{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 40%,#17130a,#050403);text-align:center}
#start h1{margin:0 0 6px;font:800 clamp(34px,7vw,64px)/1.1 'Cinzel','Nanum Myeongjo',serif;letter-spacing:.12em;background:linear-gradient(180deg,#fff3a6,#c9a94c);-webkit-background-clip:text;background-clip:text;color:transparent}
#start p{margin:0 0 22px;color:var(--pale);font-size:14px}
#start button{padding:14px 40px;font:700 20px 'Nanum Myeongjo',serif;letter-spacing:.3em;color:var(--lemon);background:rgba(255,217,61,.08);border:2px solid var(--yellow);cursor:pointer;border-radius:0 28px 28px 0}
#start button:hover{background:rgba(255,217,61,.2)}
#start small{display:block;margin-top:18px;color:rgba(233,216,166,.55);font-size:12px;line-height:1.8}
#load{position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:31;color:var(--pale);font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="mono"><span id="hudA">—</span><small>3D PROTOTYPE</small></div>
<div id="prompt" class="mono">E / Space — 조사</div>
<div id="msg" hidden><b id="mName"></b><p id="mTxt"></p><i id="mNext">▼</i></div>
<div id="choice" hidden><button type="button" data-v="1">네</button><button type="button" data-v="0">아니요</button></div>
<div id="elev" hidden role="dialog" aria-label="엘리베이터">
  <div class="top mono"><span>ELEVATOR</span><b id="eNow">100F</b></div>
  <button type="button" data-f="100"><i>100F</i><span>회장실</span><em>CHAIRMAN</em></button>
  <button type="button" data-f="95"><i>95F</i><span>사무층</span><em>OFFICE</em></button>
  <button type="button" data-f="0"><i></i><span style="text-align:center">닫기</span></button>
</div>
<div id="quest" hidden><b class="mono">QUEST</b><h4>카네히라의 질문</h4><p>카네히라가 설립자에게 여쭐 것이 있다.</p><em class="mono">준비 중 · 나중에 진행할 수 있습니다</em></div>
<div id="help" class="mono">WASD 이동 · Shift 달리기 · 마우스 드래그 시점 · E/Space 조사</div>
<div id="pad" hidden><div id="stick"><i></i></div><button id="act" type="button">조사</button></div>
<div id="fade"><div id="floor" hidden></div></div>
<div id="start"><div><h1>RASYANCUT</h1><p class="mono">3D PROTOTYPE · 설립자의 건물</p><button id="go" type="button">시작하기</button><small class="mono">WASD 이동 · Shift 달리기 · 마우스 드래그로 시점 · E / Space 조사<br>모바일: 왼쪽 스틱 이동 · 화면을 끌어 시점 · 조사 버튼</small></div></div>
<div id="load" hidden>불러오는 중…</div>
<script>/*THREE*/</script>
<script>/*GAME*/</script>
</body>
</html>
